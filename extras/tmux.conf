# Kokemusu for tmux. Source it from your tmux.conf:
#   source-file ~/.config/tmux/kokemusu.conf

set -g status-position bottom
set -g status-style "bg=default,fg=#7c7d77"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#7fa66e]#S #[fg=#2c2d2b]│ "
set -g status-right "#{?client_prefix,#[fg=#d6bd8a]prefix  ,}#[fg=#62635e]%H:%M"

set -g window-status-format "#[fg=#62635e]#I #[fg=#7c7d77]#W"
set -g window-status-current-format "#[fg=#7fa66e]#I #[fg=#cfcdc4]#W"
set -g window-status-separator "   "
set -g window-status-activity-style "fg=#d6bd8a"
set -g window-status-bell-style "fg=#c98378"

set -g pane-border-lines single
set -g pane-border-style "fg=#1e1f1e"
set -g pane-active-border-style "fg=#62635e"

set -g message-style "bg=#1e1f1e,fg=#cfcdc4"
set -g message-command-style "bg=#1e1f1e,fg=#7fa66e"
set -g mode-style "bg=#2d3a2f,fg=#e0ded5"
set -g copy-mode-match-style "bg=#33372f,fg=#cfcdc4"
set -g copy-mode-current-match-style "bg=#7fa66e,fg=#161716"

set -g clock-mode-colour "#7fa66e"
set -g clock-mode-style 24
